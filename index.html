<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DarioDAbbiero.it</title>
  <meta name="description" content="Il dominio di Dario, pagato da qualcun altro.">
  <style>
    :root {
      --bg: #f4f5f9;
      --card: #ffffff;
      --text: #1d2033;
      --muted: #6b7089;
      --accent: #7c5cff;
      --border: #e4e6f0;
      --shadow: 0 14px 40px rgba(20, 20, 60, .10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d18;
        --card: #161a2e;
        --text: #eef0ff;
        --muted: #9aa0c3;
        --accent: #a58cff;
        --border: #262b47;
        --shadow: 0 14px 40px rgba(0, 0, 0, .5);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    .box {
      width: min(100%, 420px);
      text-align: center;
      animation: up .6s ease both;
    }

    .face {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: var(--shadow);
      border: 4px solid var(--card);
    }

    h1 {
      margin: 18px 0 4px;
      font-size: 30px;
      letter-spacing: -.02em;
    }

    .sub {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .stage {
      position: relative;
      height: 120px;
      margin-bottom: 8px;
    }

    .run {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      padding: 14px 22px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(124, 92, 255, .35);
      transition: left .25s ease, top .25s ease;
    }
    .run:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .fund {
      margin-top: 28px;
      padding: 18px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .fund-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .bar {
      height: 12px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }

    .fund p {
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    dialog {
      border: 0;
      border-radius: 20px;
      padding: 26px 22px;
      max-width: min(90vw, 360px);
      background: var(--card);
      color: var(--text);
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .4);
    }
    dialog::backdrop { background: rgba(5, 6, 15, .55); }
    dialog .big { font-size: 46px; line-height: 1; }
    dialog p { margin: 10px 0 18px; color: var(--muted); }
    dialog button {
      padding: 11px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .old {
      margin: 32px 0 0;
    }

    .old img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card);
      box-shadow: var(--shadow);
    }

    .old figcaption {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="box">
    <img class="face" src="dario.png" alt="Dario">
    <h1>DarioDAbbiero.it</h1>
    <p class="sub">Dominio: 5 €. Dario: 0 €.</p>

    <div class="stage" id="stage">
      <button class="run" id="run" type="button">Riscatta il dominio · 5 €</button>
    </div>

    <section class="fund" aria-label="Raccolta fondi">
      <div class="fund-row">
        <strong>0,00 € raccolti</strong>
        <span>su 5,00 €</span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span></span></div>
      <p>In attesa di Dario.</p>
    </section>

    <figure class="old">
      <img src="dario-github.jpg" alt="Il vecchio profilo GitHub di Dario">
      <figcaption>Il suo profilo GitHub di qualche anno fa.</figcaption>
    </figure>
  </main>

  <dialog id="alert">
    <div class="big" aria-hidden="true">🚨</div>
    <p><strong>Errore: Rilevato braccino corto.</strong><br>Transazione annullata per salvaguardare il tuo portafoglio.</p>
    <button type="button" id="close">Ho capito</button>
  </dialog>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      var run = document.getElementById('run');
      var dialog = document.getElementById('alert');
      var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      function place(x, y) {
        run.style.left = x + 'px';
        run.style.top = y + 'px';
      }

      function center() {
        place((stage.clientWidth - run.offsetWidth) / 2, (stage.clientHeight - run.offsetHeight) / 2);
        run.style.transform = 'none';
      }

      if (canHover) {
        stage.addEventListener('pointermove', function (e) {
          var r = run.getBoundingClientRect();
          var near = e.clientX > r.left - 50 && e.clientX < r.right + 50 &&
                     e.clientY > r.top - 50 && e.clientY < r.bottom + 50;
          if (!near) return;

          var sr = stage.getBoundingClientRect();
          var maxX = stage.clientWidth - run.offsetWidth;
          var maxY = stage.clientHeight - run.offsetHeight;
          for (var i = 0; i < 25; i++) {
            var x = Math.random() * maxX;
            var y = Math.random() * maxY;
            var cx = sr.left + x + run.offsetWidth / 2;
            var cy = sr.top + y + run.offsetHeight / 2;
            if (Math.hypot(cx - e.clientX, cy - e.clientY) > 150) {
              place(x, y);
              return;
            }
          }
        });
      }

      run.addEventListener('click', function () {
        if (typeof dialog.showModal === 'function') {
          dialog.showModal();
        } else {
          window.alert('Errore: Rilevato braccino corto. Transazione annullata per salvaguardare il tuo portafoglio.');
        }
      });

      document.getElementById('close').addEventListener('click', function () { dialog.close(); });
      dialog.addEventListener('click', function (e) { if (e.target === dialog) dialog.close(); });

      window.addEventListener('load', center);
      window.addEventListener('resize', center);
      center();
    })();
  </script>
</body>
</html>
